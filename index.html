<!DOCTYPE html>
<html>
<head>
<style>
  body{margin:0; background:#0a0a0a; overflow:hidden}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
class Vector {
  constructor(x,y){this.x=x;this.y=y}
  static sub(a,b){return new Vector(a.x-b.x, a.y-b.y)}
  setXY(x,y){this.x=x;this.y=y}
  add(v){this.x+=v.x;this.y+=v.y; return this}
  mult(n){this.x*=n;this.y*=n; return this}
}

class Point {
  constructor(x,y,pinned){
    this.pos=new Vector(x,y)
    this.oldPos=new Vector(x,y)
    this.pinned=pinned
    this.friction=0.98
    this.gravity=new Vector(0,0.5)
  }
  update(mouse){
    if(this.pinned) return
    let vel = Vector.sub(this.pos, this.oldPos)
    this.oldPos.setXY(this.pos.x, this.pos.y)
    vel.mult(this.friction)
    vel.add(this.gravity)
    
    let {x:dx, y:dy} = Vector.sub(mouse.pos, this.pos)
    const dist = Math.sqrt(dx*dx + dy*dy)
    const direction = new Vector(dx/dist, dy/dist)
    const force = Math.max((mouse.radius - dist)/mouse.radius, 0)
    
    if(force > 0.6) this.pos.setXY(mouse.pos.x, mouse.pos.y)
    else {
      this.pos.add(vel)
      this.pos.add(direction.mult(force))
    }
  }
}

const canvas=document.getElementById('c')
const ctx=canvas.getContext('2d')
canvas.width=innerWidth; canvas.height=innerHeight

const mouse={pos:new Vector(0,0), radius:150}
window.onmousemove=e=> mouse.pos.setXY(e.clientX, e.clientY)

const points=[]
for(let i=0;i<80;i++){
  const x = Math.random()*canvas.width
  points.push(new Point(x,0,true))
  points.push(new Point(x, 100+Math.random()*200, false))
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height)
  ctx.strokeStyle='rgba(255,255,200,0.2)'
  points.forEach(p=>{
    p.update(mouse)
    if(!p.pinned){
      ctx.beginPath()
      ctx.moveTo(p.pos.x,0)
      ctx.lineTo(p.pos.x,p.pos.y)
      ctx.stroke()
      ctx.beginPath()
      ctx.arc(p.pos.x,p.pos.y,3,0,Math.PI*2)
      ctx.fillStyle='#ffeaa7'
      ctx.fill()
    }
  })
  requestAnimationFrame(animate)
}
animate()
</script>
</body>
</html>
