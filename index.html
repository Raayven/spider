<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{margin:0;background:#000;overflow:hidden;cursor:none}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
let w,h,ctx;
const canvas=document.getElementById('canvas');
ctx=canvas.getContext('2d');

function many(n, fn){ return Array.from({length:n}, fn) }
function rand(a,b){ return a + Math.random()*(b-a) }

class Leg {
  constructor(spider){ this.spider=spider; this.len=rand(30,80); this.angle=rand(0,Math.PI*2) }
  tick(t, target){
    this.angle += Math.sin(t+this.len)*0.05;
  }
}

class Spider {
  constructor(){
    this.x=rand(0,innerWidth); this.y=rand(0,innerHeight);
    this.tx=this.x; this.ty=this.y;
    this.legs=many(8, ()=>new Leg(this));
    this.particles=[];
  }
  follow(x,y){ this.tx=x; this.ty=y; }
  tick(t){
    // حركة ناعمة تابع الماوس
    this.x += (this.tx - this.x) * 0.03;
    this.y += (this.ty - this.y) * 0.03;
    
    this.legs.forEach(l=>l.tick(t));
    
    // جسم العنكبوت
    ctx.beginPath();
    ctx.arc(this.x, this.y, 3, 0, Math.PI*2);
    ctx.fill();
    
    // الرجلين كخيوط بيضاء
    this.legs.forEach((leg,i)=>{
      const ang = (i/this.legs.length)*Math.PI*2 + t;
      const x2 = this.x + Math.cos(ang+leg.angle)*leg.len;
      const y2 = this.y + Math.sin(ang+leg.angle)*leg.len;
      ctx.beginPath();
      ctx.moveTo(this.x, this.y);
      // منحنى باش يبان عضوي
      ctx.quadraticCurveTo(
        this.x + Math.cos(ang)*leg.len*0.5 + Math.sin(t*2)*10,
        this.y + Math.sin(ang)*leg.len*0.5,
        x2, y2
      );
      ctx.stroke();
      
      // نقطة فالآخر ديال الرجل
      ctx.beginPath();
      ctx.arc(x2,y2,1.2,0,Math.PI*2);
      ctx.fill();
    });

    // غبار نجوم وراها
    if(Math.random()<0.3){
      this.particles.push({x:this.x,y:this.y,life:1})
    }
    this.particles=this.particles.filter(p=>{
      p.life-=0.02; return p.life>0;
    })
  }
}

const spawn = () => new Spider();
const spiders = many(2, spawn);

addEventListener("pointermove", (e) => {
  spiders.forEach(spider => {
    spider.follow(e.clientX, e.clientY)
  })
});

// نجوم فالخلفية
const stars = many(300, ()=>({x:rand(0,5000), y:rand(0,5000), s:rand(0.5,1.5)}));

function drawCircle(x,y,r){
  ctx.fillRect(0,0,w,h);
  // رسم النجوم
  ctx.fillStyle="#fff";
  stars.forEach(st=>{
    ctx.globalAlpha=rand(0.3,1);
    ctx.fillRect((st.x - spiders[0].x*0.05)%w, (st.y - spiders[0].y*0.05)%h, st.s, st.s);
  })
  ctx.globalAlpha=1;
}

requestAnimationFrame(function anim(t) {
  if (w != innerWidth) w = canvas.width = innerWidth;
  if (h != innerHeight) h = canvas.height = innerHeight;
  
  ctx.fillStyle = "#0008";
  drawCircle(0, 0, w * 10);
  ctx.fillStyle = ctx.strokeStyle = "#fff";
  ctx.lineWidth=0.7;
  t/=1000
  spiders.forEach(spider => spider.tick(t))
  requestAnimationFrame(anim);
});
</script>
</body>
</html>
